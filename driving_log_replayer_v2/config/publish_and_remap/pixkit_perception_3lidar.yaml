# Pixkit (pixkit_autoware_launch), replay con localization:=false, LiDAR: i 3 LiDAR.
# Come pixkit_perception.yaml (solo LiDAR top), ma al posto delle nuvole grezze dei
# LiDAR riproduce la nuvola concatenata registrata sul veicolo
# (top + rear_left + rear_right, in base_link). Senza ingressi, il concatenate_data
# del replay resta muto e i crop box a valle consumano questa nuvola.
# Usato da visapp-labelling (METHOD.md, Appendice A).
publish:
  # LIDAR: nuvola concatenata dei 3 LiDAR, registrata sul veicolo
  - /sensing/lidar/concatenated/pointcloud_unfilter
  # RADAR (frame CAN grezzi, rielaborati da pe_ars408_node)
  - /sensing/radar/can_tx
  # IMU / GNSS
  - /sensing/gnss/chc/imu
  - /sensing/gnss/fix
  - /sensing/gnss/heading
  - /sensing/gnss/vel
  - /sensing/gnss/chc/pitch
  - /sensing/gnss/navpvt
  - /sensing/gnss/time_reference
  - /autoware_orientation
  # VEHICLE
  - /vehicle/status/velocity_status
  - /vehicle/status/steering_status
  - /vehicle/status/control_mode
  - /vehicle/status/gear_status
  - /vehicle/status/turn_indicators_status
  - /vehicle/status/hazard_lights_status
  # CAMERA
  - /sensing/camera/usb_cam/image_raw/compressed
  - /sensing/camera/usb_cam/camera_info
  # LOCALIZATION Outputs
  - /tf
  - /localization/kinematic_state
  - /localization/acceleration
  - /localization/pose_estimator/pose_with_covariance
